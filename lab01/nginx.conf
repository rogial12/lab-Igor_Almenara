events {}

http {
    # Limita cada IP a uma requisição por segundo
    limit_req_zone $binary_remote_addr zone=limite_por_ip:10m rate=1r/s;

    upstream meus_servidores {
        least_conn;
        server backend1:80;
        server backend2:80;
        server backend3:80;
    }

      server {
        listen 8080;

        location / {
            # Aplica o limite de requisicoes
            limit_req zone=limite_por_ip;
            limit_req_status 503;

            # Encaminha informacoes do cliente
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_pass http://meus_servidores;
        }
    }
}
